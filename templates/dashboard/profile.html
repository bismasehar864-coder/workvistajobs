{% extends 'dashboard/base_dashboard.html' %}
{% load static %}
{% block dashboard_content %}

<div class="section active" id="profile">
    <h1><svg class="icon"><use href="#icon-user"></use></svg> My profile</h1>

    <div class="insight-card">
        <div class="field">
            <label>Name</label>
            <p>{{ user.username }}</p>
        </div>
        <div class="field">
            <label>Email</label>
            <p>{{ user.email }}</p>
        </div>

        <div class="field">
            <label>Your CV</label>
            {% if request.user.profile.cv %}
            <p><a href="{{ request.user.profile.cv.url }}" target="_blank" class="view-more-btn">View CV <svg class="icon"><use href="#icon-chevron-right"></use></svg></a></p>
            {% else %}
            <p class="subtitle">No CV uploaded yet</p>
            {% endif %}
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <input type="file" name="cv" accept="application/pdf">
                <button type="submit" class="btn-secondary btn-on-light">Update CV</button>
            </form>
        </div>

        <div class="field">
            <label>Job preferences</label>
            <form method="post">
                {% csrf_token %}
                <div class="filter-pills">
                    <label class="pill"><input type="checkbox" name="job_type" value="Full-time" {% if "Full-time" in profile.job_type %}checked{% endif %}> Full-time</label>
                    <label class="pill"><input type="checkbox" name="job_type" value="Part-time" {% if "Part-time" in profile.job_type %}checked{% endif %}> Part-time</label>
                    <label class="pill"><input type="checkbox" name="job_type" value="Remote" {% if "Remote" in profile.job_type %}checked{% endif %}> Remote</label>
                    <label class="pill"><input type="checkbox" name="job_type" value="Contract" {% if "Contract" in profile.job_type %}checked{% endif %}> Contract</label>
                </div>
                <button type="submit" class="btn-primary">Save preferences</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
