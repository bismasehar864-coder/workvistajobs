{% if job.id in applied_job_ids %}
<span class="{{ button_class }}" aria-disabled="true">Already Applied</span>
{% if job.job_link %}
<a href="{{ job.job_link }}" target="_blank" rel="noopener" class="{{ button_class }}">Continue to Application <svg class="icon"><use href="#icon-chevron-right"></use></svg></a>
{% endif %}
{% elif request.user.is_authenticated %}
<form method="post" action="{% url 'apply_job' job.id %}" class="apply-job-form">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button type="submit" class="{{ button_class }}">Apply Job <svg class="icon"><use href="#icon-chevron-right"></use></svg></button>
</form>
{% else %}
<a href="{% url 'signin' %}?next={{ request.get_full_path|urlencode }}" class="{{ button_class }}">Sign in to apply <svg class="icon"><use href="#icon-chevron-right"></use></svg></a>
{% endif %}
