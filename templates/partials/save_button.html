{% if request.user.is_authenticated %}
<form method="post" action="{% url 'toggle_save_job' job.id %}" class="save-form">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button type="submit" class="save-btn{% if job.id in saved_job_ids %} saved{% endif %}" aria-label="{% if job.id in saved_job_ids %}Remove from saved jobs{% else %}Save job{% endif %}" title="{% if job.id in saved_job_ids %}Saved{% else %}Save job{% endif %}">
        <svg class="icon"><use href="#icon-{% if job.id in saved_job_ids %}bookmark-filled{% else %}bookmark{% endif %}"></use></svg>
    </button>
</form>
{% endif %}
