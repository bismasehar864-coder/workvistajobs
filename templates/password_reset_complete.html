{% extends 'base.html' %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
<link rel="stylesheet" href="{% static 'css/signin.css' %}">
{% endblock %}
{% block content %}

<div class="auth-confirm">
    <div class="card">
        <div class="icon-badge"><svg class="icon"><use href="#icon-check-circle"></use></svg></div>
        <h2>Password updated</h2>
        <p class="subtitle">Your password has been changed successfully.</p>
        <a href="{% url 'signin' %}" class="btn-primary">Sign in</a>
    </div>
</div>

{% endblock %}
